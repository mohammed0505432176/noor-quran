name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.9.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Install image tooling
        run: |
          set -o pipefail
          npm i --no-save sharp@0.35.5 @capacitor/assets@3.0.5 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Generate icon PNGs
        run: |
          set -o pipefail
          node scripts/svg-to-png.mjs 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Build web
        run: |
          set -o pipefail
          npm run build 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Upload web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web
          path: dist/

      - name: Add Android platform
        run: |
          set -o pipefail
          npx cap add android 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Generate Android icons and splash
        run: |
          set -o pipefail
          npx capacitor-assets generate --android --iconBackgroundColor '#06120d' --iconBackgroundColorDark '#06120d' --splashBackgroundColor '#06120d' --splashBackgroundColorDark '#06120d' 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Sync Capacitor
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Patch Android project
        run: |
          set -o pipefail
          node scripts/patch-android.mjs 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      # SECURITY: the bundled fallback key is public; set NOOR_KEYSTORE_B64 / NOOR_STORE_PASSWORD / NOOR_KEY_PASSWORD secrets, then delete this fallback (see SECURITY.md).
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.NOOR_KEYSTORE_B64 }}
        run: |
          # Prefer a keystore stored in repo secrets; fall back to the bundled family key.
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/noor.keystore"; else base64 -d android-signing/release.keystore.b64 > "$RUNNER_TEMP/noor.keystore"; fi

      - name: Build release APK
        working-directory: android
        env:
          NOOR_KEYSTORE: ${{ runner.temp }}/noor.keystore
          NOOR_STORE_PASSWORD: ${{ secrets.NOOR_STORE_PASSWORD || 'noorQuran2026' }}
          NOOR_KEY_ALIAS: noor
          NOOR_KEY_PASSWORD: ${{ secrets.NOOR_KEY_PASSWORD || 'noorQuran2026' }}
          NOOR_VERSION_CODE: ${{ github.run_number }}
          NOOR_VERSION_NAME: 1.9.${{ github.run_number }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log" | tee -a "$RUNNER_TEMP/build.log"

      - name: Rename APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk || { echo "signed APK missing" | tee -a "$RUNNER_TEMP/build.log"; ls -R android/app/build/outputs/apk | tee -a "$RUNNER_TEMP/build.log"; exit 1; }
          cp android/app/build/outputs/apk/release/app-release.apk "Noor-Quran-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Noor-Quran-apk
          path: Noor-Quran-${{ env.VERSION }}.apk

      - name: Certificate fingerprint
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          CERT_SHA256=$("$BT/apksigner" verify --print-certs "Noor-Quran-${VERSION}.apk" | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          if [ -z "$CERT_SHA256" ]; then echo "empty certificate fingerprint" >&2; exit 1; fi
          echo "CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.9.${{ github.run_number }}
          name: نور 1.9.${{ github.run_number }}
          make_latest: true
          files: Noor-Quran-${{ env.VERSION }}.apk
          body: |
            ## تطبيق نور - الإصدار 1.9.${{ github.run_number }}

            ### طريقة التثبيت على أندرويد
            1. حمّل ملف APK من الأسفل (Noor-Quran-1.9.${{ github.run_number }}.apk).
            2. افتح الملف، وإذا طلب الجهاز فاسمح بالتثبيت من مصادر غير معروفة لهذا المتصفح أو مدير الملفات.
            3. اضغط تثبيت ثم افتح التطبيق.
            ### إذا لم يتثبّت التطبيق
            - **«التطبيق غير مثبّت» أو «تعارض مع حزمة موجودة»**: احذف نسخة نور القديمة من الجهاز (خصوصاً إن ثبّتّها من مصدر آخر) ثم ثبّت من جديد.
            - **حماية Play (Play Protect) أوقفت التثبيت**: اضغط «مزيد من التفاصيل» ثم «التثبيت على أي حال».
            - **لم يكتمل التنزيل**: حجم الملف الصحيح هو المكتوب بجانبه في صفحة الإصدار (نحو ٢٠ ميغابايت)؛ إن كان أصغر فأعد التنزيل عبر Chrome.
            - **الجهاز قديم**: يتطلب أندرويد ٦ أو أحدث.

            ### التحقق من أصالة التطبيق
            بصمة شهادة التوقيع (SHA-256) للنسخ الرسمية:
            `${{ env.CERT_SHA256 }}`

            للآيفون: افتح النسخة الويب في Safari ثم مشاركة ثم "إضافة إلى الشاشة الرئيسية".

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "فشل البناء في التشغيل رقم ${{ github.run_number }}."; echo; echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "${{ github.repository }}" --title "Build failed #${{ github.run_number }}" --body-file "$RUNNER_TEMP/issue.md" || true
